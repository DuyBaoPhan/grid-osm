<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OSM POI Scraper -- Tile Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: 'Segoe UI', sans-serif; background:#0f172a; color:#e2e8f0; }
  #map { height: 100vh; width: 100%; }

  #panel {
    position: absolute; top: 16px; right: 16px; z-index: 1000;
    background: rgba(15,23,42,0.92);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 18px 22px;
    min-width: 250px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  #panel h2 { font-size: 13px; font-weight: 700; color:#94a3b8; letter-spacing:.08em; text-transform:uppercase; margin-bottom:14px; }

  .badge-live {
    display:inline-flex; align-items:center; gap:5px;
    background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.15);
    border-radius:99px; padding:2px 10px; font-size:11px; color:#94a3b8;
    margin-bottom:14px;
  }
  .dot-live { width:7px;height:7px;border-radius:50%;background:#94a3b8;transition:background 0.3s; }
  .dot-live.active { background:#22c55e; animation: pulse 1.5s infinite; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5); }
    50% { box-shadow: 0 0 0 5px rgba(34,197,94,0); }
  }

  .stat { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .stat-label { font-size:13px; color:#94a3b8; }
  .stat-value { font-size:15px; font-weight:700; }
  .val-done   { color:#22c55e; }
  .val-queued { color:#f59e0b; }
  .val-pending{ color:#64748b; }
  .val-poi    { color:#818cf8; }
  .val-discarded { color:#f43f5e; }

  .progress-bar {
    background: #1e293b; border-radius: 99px;
    height: 8px; margin: 14px 0 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, #22c55e, #38bdf8);
  }
  .progress-label { font-size:11px; color:#64748b; text-align:right; }

  .legend { margin-top:14px; border-top:1px solid rgba(255,255,255,0.08); padding-top:12px; }
  .leg-item { display:flex; align-items:center; gap:8px; margin-bottom:5px; font-size:12px; color:#94a3b8; }
  .leg-dot { width:12px; height:12px; border-radius:3px; flex-shrink:0; }
  .tile-tooltip {
    background: rgba(15,23,42,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; color: #e2e8f0;
    font-size: 12px; padding: 4px 8px; white-space: nowrap;
  }

  .btn-refresh {
    display: block; width: 100%; margin-top: 14px;
    background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.4);
    color: #38bdf8; padding: 8px 16px; border-radius: 8px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-refresh:hover {
    background: #38bdf8; color: #0f172a;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
  }
</style>
</head>
<body>

<!-- SVG Pattern definitions removed -->

<div id="map"></div>
<div id="panel">
  <div class="badge-live"><div class="dot-live"></div> <span id="live-status">Đang kết nối...</span></div>
  <h2>Progress Overview</h2>
  <div class="stat"><span class="stat-label">Tổng số ô</span>      <span class="stat-value">1511</span></div>
  <div class="stat"><span class="stat-label">Đã quét</span>       <span class="stat-value val-done">5</span></div>
  <div class="stat"><span class="stat-label">Bỏ qua (Ngoài quận)</span> <span class="stat-value val-discarded">0</span></div>
  <div class="stat"><span class="stat-label">Đang chờ (Queue)</span> <span class="stat-value val-queued">1511</span></div>
  <div class="stat"><span class="stat-label">Chưa xử lý</span>      <span class="stat-value val-pending">0</span></div>
  <div class="stat"><span class="stat-label">Đã tìm thấy (POI)</span> <span class="stat-value val-poi">8</span></div>

  <div class="progress-bar"><div class="progress-fill" style="width:0.33%"></div></div>
  <div class="progress-label">0.33% hoàn thành</div>

  <button onclick="window.location.reload()" class="btn-refresh">🔄 Làm mới bản đồ</button>

  <div class="legend">
    <div class="leg-item"><div class="leg-dot" style="background:#22c55e"></div> Đã quét (Done)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#00d2ff"></div> Đang xử lý AI (Captured)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#f59e0b"></div> Đang chờ xử lý (Queue)</div>
    <div class="leg-item"><div class="leg-dot" style="background:#475569"></div> Chưa bắt đầu (Pending)</div>
  </div>
</div>

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
}).addTo(map);

L.circleMarker([10.779921962399342,106.70003066390481], {
  radius: 8, color: '#818cf8', fillColor: '#818cf8',
  fillOpacity: 0.9, weight: 2,
}).addTo(map).bindPopup('<b>Tâm quét (Quận 1)</b><br>10.779922, 106.700031');

 10.7941097], [106.6862255, 10.7933609], [106.6863497, 10.7932013], [106.6863946, 10.7930891], [106.6863951, 10.7929757], [106.6863825, 10.7928942], [106.686358, 10.7928242], [106.6862779, 10.792689], [106.6861498, 10.7925061], [106.6866889, 10.7920879], [106.6875146, 10.7914471], [106.6877188, 10.7912886], [106.6893447, 10.7899889], [106.6895735, 10.7898087], [106.6896856, 10.7897171], [106.6897055, 10.7897014], [106.689793, 10.7896323], [106.6901643, 10.7893349], [106.6908273, 10.7888038], [106.6919922, 10.7878726], [106.6937476, 10.7864709], [106.6959855, 10.7846839], [106.6970435, 10.7838172], [106.6981274, 10.7828849], [106.6950078, 10.77958], [106.6939511, 10.7784635], [106.6930249, 10.7774849], [106.6916481, 10.7760037], [106.6905661, 10.7748277], [106.6894575, 10.7736226], [106.6878639, 10.7719345], [106.6872117, 10.7712435], [106.6864435, 10.770428], [106.6860996, 10.7700629], [106.6844859, 10.7683635], [106.6843105, 10.768177], [106.6839769, 10.7678222], [106.6823407, 10.7660818], [106.68223, 10.7659641], [106.6820988, 10.7658222], [106.6819748, 10.7656968], [106.6818339, 10.7655624], [106.6816889, 10.7654323]]]}};
if (boundaryGeojson) {
  L.geoJSON(boundaryGeojson, {
    style: {
      color: '#0055ff', // Màu xanh dương đậm cá tính và rõ nét
      weight: 5,        // Tăng độ dày viền lên 5px cực kỳ rõ nét
      fillColor: '#0055ff',
      fillOpacity: 0.08, // Màu nền đa giác đậm nét hơn một chút
      interactive: true
    }
  }).addTo(map).bindPopup('<b>Ranh giới hành chính: Quận 1</b>');
}

const geojson = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"tx": 417536, "ty": 246351, "status": "done", "color": "#00ff66", "opacity": 0.7}, "geometry": {"type": "Polygon", "coordinates": [[[106.6990006956431, 10.77958469785845], [106.6996873411509, 10.77958469785845], [106.6996873411509, 10.780259226562256], [106.6990006956431, 10.780259226562256], [106.6990006956431, 10.77958469785845]]]}}, {"type": "Feature", "properties": {"tx": 417537, "ty": 246350, "status": "done", "color": "#00ff66", "opacity": 0.7}, "geometry": {"type": "Polygon", "coordinates": [[[106.6996873411509, 10.780259226562256], [106.70037398665872, 10.780259226562256], [106.70037398665872, 10.780933753754098], [106.6996873411509, 10.780933753754098], [106.6996873411509, 10.780259226562256]]]}}, {"type": "Feature", "properties": {"tx": 417537, "ty": 246351, "status": "done", "color": "#00ff66", "opacity": 0.7}, "geometry": {"type": "Polygon", "coordinates": [[[106.6996873411509, 10.77958469785845], [106.70037398665872, 10.77958469785845], [106.70037398665872, 10.780259226562256], [106.6996873411509, 10.780259226562256], [106.6996873411509, 10.77958469785845]]]}}, {"type": "Feature", "properties": {"tx": 417537, "ty": 246352, "status": "done", "color": "#00ff66", "opacity": 0.7}, "geometry": {"type": "Polygon", "coordinates": [[[106.6996873411509, 10.778910167642767], [106.70037398665872, 10.778910167642767], [106.70037398665872, 10.77958469785845], [106.6996873411509, 10.77958469785845], [106.6996873411509, 10.778910167642767]]]}}, {"type": "Feature", "properties": {"tx": 417538, "ty": 246350, "status": "captured", "color": "#00d2ff", "opacity": 0.7}, "geometry": {"type": "Polygon", "coordinates": [[[106.70037398665872, 10.780259226562256], [106.70106063216653, 10.780259226562256], [106.70106063216653, 10.780933753754098], [106.70037398665872, 10.780933753754098], [106.70037398665872, 10.780259226562256]]]}}, {"type": "Feature", "properties": {"tx": 417538, "ty": let processedGeojson = { type: "FeatureCollection", features: [] };

if (typeof boundaryGeojson !== 'undefined' && boundaryGeojson && typeof turf !== 'undefined') {
  const boundaryPoly = boundaryGeojson.geometry;
  
  geojson.features.forEach(f => {
    try {
      const tilePoly = f.geometry;
      
      // 1. Tính phần giao nhau (nằm TRONG ranh giới quận) -> Giữ nguyên thuộc tính Done
      const insideIntersection = turf.intersect(turf.feature(tilePoly), turf.feature(boundaryPoly));
      if (insideIntersection) {
        const insideFeature = JSON.parse(JSON.stringify(f));
        insideFeature.geometry = insideIntersection.geometry;
        processedGeojson.features.push(insideFeature);
      }

    } catch (err) {
      processedGeojson.features.push(f);
    }
  });
} else {
  processedGeojson = geojson;
}

L.geoJSON(processedGeojson, {
  style: f => ({
    fillColor: f.properties.color, 
    fillOpacity: f.properties.color === 'url(#stripes)' ? 0.90 : 0.80, 
    color: f.properties.color === 'url(#stripes)' ? '#ff3355' : (f.properties.status === 'captured' ? '#00d2ff' : '#00ff66'), 
    weight: 3.0, 
    opacity: 1.0, 
  }),
  onEachFeature: (f, layer) => {
    const p = f.properties;
    layer.bindTooltip(
      `Tile (${p.tx}, ${p.ty}) &mdash; <b>${p.status === 'discarded' ? 'Ngoài ranh giới' : p.status}</b>`,
      { className: 'tile-tooltip', sticky: true }
    );
  },
}).addTo(map);

// Tu dong luu trang thai map khi keo, zoom
map.on('moveend', () => {
  const center = map.getCenter();
  localStorage.setItem('map_lat', center.lat);
  localStorage.setItem('map_lng', center.lng);
});
map.on('zoomend', () => {
  localStorage.setItem('map_zoom', map.getZoom());
});

// ── Auto-reload khi file map_status.json được cập nhật ─────────────
(function() {
  let lastTs = null;
  const STATUS_URL = 'map_status.json';
  const dot = document.querySelector('.dot-live');
  const lbl = document.getElementById('live-status');

  function setLive(active) {
    if (active) {
      dot.classList.add('active');
      lbl.textContent = 'Tự động cập nhật (≲3s)';
    } else {
      dot.classList.remove('active');
      lbl.textContent = 'Không có kết nối';
    }
  }

  async function checkStatus() {
    try {
      const resp = await fetch(STATUS_URL + '?_=' + Date.now());
      if (!resp.ok) { setLive(false); return; }
      const data = await resp.json();
      setLive(true);
      if (lastTs === null) {
        lastTs = data.ts;
        return;
      }
      if (data.ts !== lastTs) {
        lastTs = data.ts;
        // Lưu vị trí trước khi reload
        const c = map.getCenter();
        localStorage.setItem('map_lat', c.lat);
        localStorage.setItem('map_lng', c.lng);
        localStorage.setItem('map_zoom', map.getZoom());
        window.location.reload();
      }
    } catch (e) {
      setLive(false);
    }
  }

  // Kiểm tra ngay lập tức rồi mỗi 3 giây
  checkStatus();
  setInterval(checkStatus, 3000);
})();
</script>

</html>
